<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>تم نقل الموقع | The site has moved</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1719;color:#e8eeec;font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:24px}
 a{color:#3fb5a3;font-weight:600}
 p{margin:6px 0}
</style>
<script>
// Old address of the practice site. Sends visitors to the new address and
// carries over progress saved in this browser (it lives on q55.github.io).
var TARGET = "https://assessment-practice.web.app/";
(function(){
  var url = TARGET;
  try {
    var sameOrigin = new URL(TARGET).origin === location.origin;
    var state = localStorage.getItem("aramcoPrep_v2");
    if (!sameOrigin && state) {
      var b64 = btoa(unescape(encodeURIComponent(state)));
      url = TARGET + "#import=" + encodeURIComponent(b64);
    }
  } catch (e) {}
  location.replace(url);
  document.addEventListener("DOMContentLoaded", function(){ document.getElementById("go").href = url; });
})();
</script>
</head>
<body>
<div>
 <p>تم نقل الموقع إلى عنوان جديد. جارٍ تحويلك…</p>
 <p>The site has moved. Redirecting…</p>
 <p><a id="go" href="https://assessment-practice.web.app/">افتح الموقع الجديد · Open the new site</a></p>
</div>
</body>
</html>
